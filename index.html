<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aespa fan page layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #ffffff;
      color: #111;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 헤더 */
    .site-header {
      height: 86px;
      background: #fff;
      border-bottom: 2px solid #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
    }

    .logo {
      margin: 0;
      font-size: 54px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -2px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #111;
      user-select: none;
    }

    .gnb {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 15px;
      font-weight: 600;
    }

    .gnb a:hover {
      opacity: 0.7;
    }

    /* 메인 */
    main {
      flex: 1;
      background: #e9e9e9;
      border-top: 1px solid #f1f1f1;
    }

    .main-placeholder {
      min-height: 560px;
    }

    /* 푸터 */
    .site-footer {
      background: #1f3266;
      color: #ffffff;
      padding: 34px 46px 28px;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 90px;
    }

    .footer-logo {
      font-size: 56px;
      line-height: 1;
      letter-spacing: -2px;
      color: #0c1226;
      font-family: "Trebuchet MS", Arial, sans-serif;
      user-select: none;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-btn {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      opacity: 0.95;
    }

    .social-btn.round {
      border-radius: 50%;
    }

    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 22px;
      text-align: right;
    }

    .team-block {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .team-title {
      font-weight: 700;
      white-space: nowrap;
    }

    .team-members {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .code-link {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
    }

    .github-icon {
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .copyright {
      margin-top: 18px;
      text-align: right;
      font-size: 12px;
      opacity: 0.7;
    }

    /* 반응형 */
    @media (max-width: 900px) {
      .site-header {
        height: auto;
        padding: 18px 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo {
        font-size: 40px;
      }

      .gnb {
        gap: 14px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      .main-placeholder {
        min-height: 360px;
      }

      .site-footer {
        padding: 24px 20px;
      }

      .footer-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 28px;
      }

      .footer-left {
        gap: 28px;
      }

      .footer-logo {
        font-size: 42px;
      }

      .footer-right {
        align-items: flex-start;
        text-align: left;
      }

      .team-block {
        flex-direction: column;
        gap: 8px;
      }

      .copyright {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
    <h1 class="logo">
      <a href="#" aria-label="aespa 홈">
        <img class="header-logo-img" src="./aespa-logo.png" alt="aespa 로고"
         style="display:block;width:120px;height:auto;"
          />
      </a>
    </h1>

      <nav aria-label="주요 메뉴">
        <ul class="gnb">
          <li><a href="#">About</a></li>
          <li><a href="#">Discography</a></li>
          <li><a href="#">Gallery</a></li>
          <li><a href="#">Schedule</a></li>
          <li><a href="#">Community</a></li>
          <li><a href="#">Fan-letter</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="main-placeholder" aria-label="메인 콘텐츠 영역"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-top">
        <div class="footer-left">
        <div class="footer-logo">
          <img class="footer-logo-img" src="./aespa-logo.png" alt="aespa 로고" 
          style="display:block;width:120px;height:auto;"
          />
        </div>

          <div class="socials" aria-label="소셜 링크">
            <a class="social-btn round" href="#" aria-label="X">X</a>
            <a class="social-btn" href="#" aria-label="YouTube">▶</a>
            <a class="social-btn" href="#" aria-label="Instagram">◎</a>
          </div>
        </div>

        <div class="footer-right">
          <div class="team-block">
            <div class="team-title">Sprint for Team 4</div>
            <div class="team-members">
              <div>PARK SO JEONG</div>
              <div>YOO SEO HYEON</div>
              <div>YOO LEE JUN</div>
              <div>LEE SANG YUN</div>
              <div>LEE JI YEON</div>
              <div>CHOO MYUNG SEONG</div>
              <div>CHOO MYUNG GON</div>
            </div>
          </div>

          <a class="code-link" href="#" target="_blank" rel="noopener noreferrer">
            <span>Code</span>
            <span class="github-icon" aria-hidden="true">G</span>
          </a>
        </div>
      </div>

      <div class="copyright">© 2026 FS-aespa-4팀(12기) All rights reserved</div>
    </footer>
  </div>
</body>
</html>
