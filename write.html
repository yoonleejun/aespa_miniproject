    <header class="site-header">

          <input class="input" placeholder="제목을 입력해주세요." />

비방, 욕설, 허위 정보가 포함된 글은 삭제될 수 있습니다."

        <section class="button-container">

          <p class="modal-font">좋은 하루 보내세요 : )🍀</p>
          <a class="modal-button" href="/writeList.html"
            ><p>닫기</p></a
          ></secction
        >
